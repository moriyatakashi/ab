# ab/config/values.yml
# 案件ごとの設定値の記録。手順そのものはt1/t2のページを参照。
# ここに書く値は秘密ではない前提（クライアントIDは公開前提の値のため）。
#
# 例（実際の値が発行されたらこの形で追加する）:
# google_oauth:
#   - id: "xxxxxxxxxx.apps.googleusercontent.com"
#     purpose: "ab全体のSign in with Google用（caのログインゲートで使用）"
#     type: "web application"
#     created: "2026-08-01"
#     authorized_origins:
#       - "https://moriyatakashi.github.io"
#     used_by:
#       - "src/ca/index.html"
#     note: "aaのクライアントIDとは別に新規発行。理由: abを別アプリとして見せたい／失効時の影響を分離したいため"

google_oauth: []

# 「実際に与えられている権限」。roles.yml(天井)とは別物、常に最小・現在地だけを表す。
# 値そのものは書かない(トークン本体は秘密。scope名や有無は秘密ではない)。
github_pat:
  - holder: 利尻
    via: "gh auth login (OAuth)"
    scopes: [delete_repo, gist, read:org, repo, workflow]
    note: "PC常駐のためgh auth loginの状態が永続し、失効の概念が別(2026-08-02確認)。scope自体は今回の整理より前からの既存状態で未精査。"
  - holder: すま
    via: "手動発行PAT、/mnt/project/github_pat.txtに保存(rbook/run.pyがこの名前で読む)"
    scopes: [repo, workflow]
    note: "2026-08-02、rbook\\runのPAT依存コマンド(repos/repo/dump/test)が実際に必要とする最小分のみに絞った。値は失効中、再発行手順はab/src/s4/。"

ba_write_key:
  - holder: 利尻
    env: BA_CLAUDE_KEY_PC
    status: available
  - holder: すま
    env: BA_CLAUDE_KEY_MOBILE
    status: not_implemented
    note: "rbook/run.py側に対応する実装がまだ無く、すまさんはrbook\\run経由でba書き込みができない(2026-08-02棚卸しで判明)。"
