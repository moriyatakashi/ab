# ab/config/roles.yml
# 「したい役割」(天井)。ba-167を構造化したもの。ここに書かれた範囲は「本来やってよいこと」で、
# 実際に付与されている権限(values.ymlのgithub_pat/ba_write_key等)とは別物。
# 権限がかぶることは許容する(2026-08-02決定、ba-167note参照)。実際の付与は最小から始め、
# 必要になったら足す(きつめに始めて弊害が出たら足す方針)。

すま:
  primary:
    - 提案
    - 軽い実装
    - GitHub操作
    - ba操作
  also_allowed:
    - git操作
    - Azure操作
    - 重い実装
  not_allowed:
    - 破壊的操作(削除等)の実行  # 報告のみ。実行はTakashi&利尻(ba-167)

利尻:
  primary:
    - git操作
    - Azure操作
    - ブラウザ操作
    - 重い実装
    - 破壊的操作(Takashiと合意の上)
  also_allowed:
    - 提案
    - GitHub操作
    - ba操作

source: "ba-167"
